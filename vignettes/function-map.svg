<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 892" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6472"/>
    </marker>
    <marker id="arrowAccent" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f6f8b"/>
    </marker>
    <style>
      .band     { fill:#f4f6f8; stroke:#dfe4ea; stroke-width:1; rx:10; }
      .bandlab  { font-size:12px; font-weight:600; fill:#8a939f; letter-spacing:.08em; }
      .exported { fill:#e8f2f6; stroke:#1f6f8b; stroke-width:1.6; rx:7; }
      .internal { fill:#ffffff; stroke:#b9c1cb; stroke-width:1.1; rx:6; }
      .dataset  { fill:#f5efe4; stroke:#b08d47; stroke-width:1.4; rx:7; }
      .nm       { font-size:12.5px; font-weight:600; fill:#1b2430; }
      .nmi      { font-size:11.5px; fill:#3d4753; }
      .edge     { stroke:#5b6472; stroke-width:1.3; fill:none; marker-end:url(#arrow); }
      .edgeA    { stroke:#1f6f8b; stroke-width:1.8; fill:none; marker-end:url(#arrowAccent); }
      .note     { font-size:11px; fill:#6b7480; }
    </style>
  </defs>

  <rect width="960" height="892" fill="#ffffff"/>

  <text x="24" y="30" font-size="17" font-weight="700" fill="#1b2430">Stem: how the functions fit together</text>
  <text x="24" y="50" class="note">Blue boxes are exported; white boxes are internal. Arrows point from caller to callee.</text>

  <!-- ============ BAND 1: data + model construction ============ -->
  <rect class="band" x="24" y="70" width="912" height="92"/>
  <text x="36" y="90" class="bandlab">DATA AND MODEL OBJECT</text>

  <rect class="dataset" x="44" y="100" width="96" height="34"/>
  <text x="92" y="122" class="nm" text-anchor="middle">pm10</text>

  <rect class="dataset" x="152" y="100" width="104" height="34"/>
  <text x="204" y="122" class="nm" text-anchor="middle">povalley</text>

  <rect class="exported" x="330" y="100" width="140" height="34"/>
  <text x="400" y="122" class="nm" text-anchor="middle">STEM_Model</text>

  <rect class="internal" x="530" y="100" width="130" height="34"/>
  <text x="595" y="121" class="nmi" text-anchor="middle">STEM_Skeleton</text>

  <rect class="internal" x="686" y="100" width="130" height="34"/>
  <text x="751" y="121" class="nmi" text-anchor="middle">STEM_Data</text>

  <path class="edge" d="M 256 117 L 324 117"/>
  <path class="edge" d="M 470 117 L 524 117"/>
  <path class="edge" d="M 470 117 L 524 117"/>
  <path class="edge" d="M 660 117 L 680 117"/>

  <!-- ============ BAND 2: estimation engine ============ -->
  <rect class="band" x="24" y="180" width="912" height="240"/>
  <text x="36" y="200" class="bandlab">ESTIMATION ENGINE (EM + KALMAN)</text>

  <rect class="exported" x="44" y="215" width="150" height="36"/>
  <text x="119" y="238" class="nm" text-anchor="middle">STEM_Estimation</text>

  <rect class="internal" x="250" y="215" width="110" height="36"/>
  <text x="305" y="237" class="nmi" text-anchor="middle">kalman</text>

  <path class="edgeA" d="M 194 233 L 244 233"/>

  <!-- kalman children: filtering / smoothing -->
  <rect class="internal" x="420" y="196" width="112" height="30"/>
  <text x="476" y="215" class="nmi" text-anchor="middle">filtering</text>
  <rect class="internal" x="570" y="196" width="112" height="30"/>
  <text x="626" y="215" class="nmi" text-anchor="middle">filterstep</text>
  <path class="edge" d="M 360 226 L 414 213"/>
  <path class="edge" d="M 532 211 L 564 211"/>

  <rect class="internal" x="420" y="238" width="112" height="30"/>
  <text x="476" y="257" class="nmi" text-anchor="middle">smoothing</text>
  <rect class="internal" x="570" y="238" width="150" height="30"/>
  <text x="645" y="257" class="nmi" text-anchor="middle">smootherstep(.uni)</text>
  <path class="edge" d="M 360 240 L 414 253"/>
  <path class="edge" d="M 532 253 L 564 253"/>

  <!-- kalman children: Q function and derivatives -->
  <rect class="internal" x="250" y="290" width="200" height="30"/>
  <text x="350" y="309" class="nmi" text-anchor="middle">Q_function_addendo1/2/3</text>
  <path class="edge" d="M 305 251 L 305 284"/>

  <rect class="internal" x="250" y="330" width="200" height="30"/>
  <text x="350" y="349" class="nmi" text-anchor="middle">d1_Q, d2_Q, d12_Q</text>

  <rect class="internal" x="250" y="370" width="200" height="30"/>
  <text x="350" y="389" class="nmi" text-anchor="middle">B_function, cov_lagone</text>

  <rect class="internal" x="480" y="330" width="250" height="30"/>
  <text x="605" y="349" class="nmi" text-anchor="middle">d1/d2_Sigmastar_logb.exp</text>

  <rect class="internal" x="480" y="370" width="250" height="30"/>
  <text x="605" y="389" class="nmi" text-anchor="middle">d1/d2_Sigmastar_logtheta.exp</text>

  <rect class="internal" x="760" y="290" width="160" height="30"/>
  <text x="840" y="309" class="nmi" text-anchor="middle">Sigmastar.exp</text>
  <rect class="internal" x="760" y="330" width="160" height="30"/>
  <text x="840" y="349" class="nmi" text-anchor="middle">sumMatrices</text>
  <rect class="internal" x="760" y="370" width="160" height="30"/>
  <text x="840" y="389" class="nmi" text-anchor="middle">changedimension_covariates</text>

  <path class="edge" d="M 210 251 L 245 300" opacity="0"/>
  <path class="edge" d="M 305 320 L 305 324"/>
  <path class="edge" d="M 305 360 L 305 364"/>
  <path class="edge" d="M 450 345 L 474 345"/>
  <path class="edge" d="M 450 385 L 474 385"/>
  <path class="edge" d="M 730 345 L 754 345"/>

  <!-- ============ BAND 3: STEM services ============ -->
  <rect class="band" x="24" y="438" width="912" height="118"/>
  <text x="36" y="458" class="bandlab">SIMULATION, PREDICTION AND UNCERTAINTY</text>

  <rect class="exported" x="44" y="472" width="150" height="34"/>
  <text x="119" y="494" class="nm" text-anchor="middle">STEM_Simulation</text>

  <rect class="exported" x="230" y="472" width="140" height="34"/>
  <text x="300" y="494" class="nm" text-anchor="middle">STEM_Kriging</text>

  <rect class="internal" x="230" y="515" width="140" height="30"/>
  <text x="300" y="534" class="nmi" text-anchor="middle">spatial.pred</text>
  <path class="edge" d="M 300 506 L 300 509"/>

  <rect class="exported" x="420" y="472" width="150" height="34"/>
  <text x="495" y="494" class="nm" text-anchor="middle">STEM_Bootstrap</text>

  <rect class="internal" x="420" y="515" width="150" height="30"/>
  <text x="495" y="534" class="nmi" text-anchor="middle">STEM_Bootstrap.fn</text>
  <path class="edge" d="M 495 506 L 495 509"/>

  <path class="edge" d="M 419 530 L 200 500" stroke-dasharray="4 3"/>
  <path class="edge" d="M 445 515 L 160 258" stroke-dasharray="4 3"/>

  <!-- ============ BAND 4: SC-STEM ============ -->
  <rect class="band" x="24" y="574" width="912" height="262"/>
  <text x="36" y="594" class="bandlab">SPATIALLY-CLUSTERED STEM (SC-STEM)</text>

  <rect class="exported" x="44" y="612" width="160" height="38"/>
  <text x="124" y="636" class="nm" text-anchor="middle">SCSTEM_Estim</text>

  <rect class="exported" x="44" y="676" width="160" height="34"/>
  <text x="124" y="698" class="nm" text-anchor="middle">SCSTEM_Infocrit</text>

  <rect class="exported" x="44" y="732" width="160" height="34"/>
  <text x="124" y="754" class="nm" text-anchor="middle">SCSTEM_Select</text>

  <rect class="exported" x="44" y="788" width="160" height="34"/>
  <text x="124" y="810" class="nm" text-anchor="middle">SCSTEM_Bootstrap</text>

  <rect class="exported" x="250" y="788" width="185" height="34"/>
  <text x="342" y="810" class="nm" text-anchor="middle">SCSTEM_BootInference</text>

  <!-- vertical pipeline arrows -->
  <path class="edgeA" d="M 124 710 L 124 726"/>
  <path class="edgeA" d="M 124 766 L 124 782"/>
  <path class="edgeA" d="M 204 805 L 244 805"/>
  <path class="edgeA" d="M 124 676 L 124 656" transform="translate(0,0)"/>

  <!-- SCSTEM_Infocrit -> SCSTEM_Estim (loops over the grid) -->
  <path class="edgeA" d="M 30 693 C 14 693 14 631 38 631"/>
  <text x="8" y="662" class="note" transform="rotate(-90 8 662)">grid</text>

  <!-- helpers -->
  <rect class="internal" x="250" y="606" width="200" height="28"/>
  <text x="350" y="624" class="nmi" text-anchor="middle">scstem_neighbours</text>
  <rect class="internal" x="250" y="640" width="200" height="28"/>
  <text x="350" y="658" class="nmi" text-anchor="middle">scstem_init / _repair_partition</text>
  <rect class="internal" x="470" y="606" width="200" height="28"/>
  <text x="570" y="624" class="nmi" text-anchor="middle">scstem_loglike_i</text>
  <rect class="internal" x="470" y="640" width="200" height="28"/>
  <text x="570" y="658" class="nmi" text-anchor="middle">scstem_swap_pass</text>
  <rect class="internal" x="690" y="606" width="200" height="28"/>
  <text x="790" y="624" class="nmi" text-anchor="middle">scstem_potts_pairs / _pen_local</text>
  <rect class="internal" x="690" y="640" width="200" height="28"/>
  <text x="790" y="658" class="nmi" text-anchor="middle">scstem_npar / _covariate_means</text>

  <path class="edge" d="M 204 626 L 244 620"/>
  <path class="edge" d="M 204 636 L 244 650"/>

  <rect class="internal" x="470" y="700" width="200" height="28"/>
  <text x="570" y="718" class="nmi" text-anchor="middle">scstem_ari</text>
  <rect class="internal" x="690" y="700" width="200" height="28"/>
  <text x="790" y="718" class="nmi" text-anchor="middle">scstem_align_labels</text>
  <path class="edge" d="M 204 748 C 380 748 400 726 464 716"/>
  <path class="edge" d="M 435 800 C 560 800 640 746 700 728"/>

  <!-- SCSTEM_Estim reaches back into the engine -->
  <path class="edgeA" d="M 60 612 C 40 560 40 300 110 254"/>
  <text x="26" y="470" class="note" transform="rotate(-90 26 470)">one STEM fit per regime</text>

  <!-- SCSTEM_Bootstrap reaches STEM_Simulation and back to SCSTEM_Estim -->
  <path class="edge" d="M 124 788 C 124 770 130 560 119 512" stroke-dasharray="4 3"/>

  <text x="24" y="856" class="note">SCSTEM_Bootstrap regenerates the data regime by regime and re-runs</text>
  <text x="24" y="872" class="note">the whole SC-STEM procedure, clustering included, on every draw.</text>
</svg>
