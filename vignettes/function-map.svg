  <text x="8" y="662" class="note" transform="rotate(-90 8 662)">grid</text>
  <text x="26" y="470" class="note" transform="rotate(-90 26 470)">one STEM fit per regime</text>
  <text x="24" y="856" class="note">SCSTEM_Bootstrap regenerates the data regime by regime and re-runs</text>
  <text x="24" y="872" class="note">the whole SC-STEM procedure, clustering included, on every draw.</text>
  <text x="470" y="856" class="note">STEM_Fit is the single entry point: it dispatches to STEM_Estimation</text>
