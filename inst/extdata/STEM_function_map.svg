  <text x="8" y="742" class="note" transform="rotate(-90 8 742)">grid</text>
  <text x="14" y="560" class="note" transform="rotate(-90 14 560)">one STEM fit per regime</text>
  <text x="24" y="936" class="note">SCSTEM_Bootstrap regenerates the data regime by regime and re-runs</text>
  <text x="24" y="952" class="note">the whole SC-STEM procedure, clustering included, on every draw.</text>
  <text x="470" y="936" class="note">STEM_Fit is the single entry point: it dispatches to STEM_Estimation</text>
